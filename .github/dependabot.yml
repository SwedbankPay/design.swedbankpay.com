version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "03:00"
      timezone: Europe/Oslo
    open-pull-requests-limit: 99
  # Security updates are grouped into one pull request. Weekly version updates
  # are grouped into one pull request for production (minor/patch) and one for
  # development dependencies (minor/patch), plus one for development major
  # updates. Production major updates are raised as separate pull requests, as
  # they can affect consumers of the package.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Europe/Oslo
    open-pull-requests-limit: 99
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
      npm-production-minor-patch:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch
      npm-development-minor-patch:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch
      npm-development-major:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - major
